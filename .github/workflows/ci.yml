name: Verify Reflow demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit test
        run: npm test
      - name: Gateway test
        run: npm run test:gateway
      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium
      - name: Core pipeline E2E
        run: npm run test:e2e
      - name: Static export
        run: npm run export:web
